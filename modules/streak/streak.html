<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streak - Purrfect Pomodoro Timer</title>
  <link rel="shortcut icon" href="../../assets/cat.png">
  <link rel="stylesheet" href="../global.css">
  <link rel="stylesheet" href="./streak.css">
  <script type="module" defer src="./streak.js"></script>
</head>
<body>
  <div class="container">
  <div id="toast-container"></div>
    <div class="sub-container">
      <div class="main-streak-top">
        <div class="main-left">
          <div class="icon fire-icon">
            <img src="../../assets/icons/fire_3d.png" alt="fire icon">
          </div>
          <div class="main-left-title">
            <p> <span class="current-streak">0</span> days</p>
            <p>focus streak</p>
          </div>
        </div>
        <div class="main-right">
          <div class="top-metric">
            <p>Highest: <span id="max-streak">0</span> days</p>
            <p><span id="pomos-today">0</span> Pomodoros today</p>
          </div>
          <div class="weekly-streak-container">
            <div class="day-container">
              <span class="streak-check"></span>
              <span class="day-name">Mon</span>
            </div>
            <div class="day-container">
              <span class="streak-check"></span>
              <span class="day-name">Tue</span>
            </div>
            <div class="day-container">
              <span class="streak-check check"></span>
              <span class="day-name">Wed</span>
            </div>
            <div class="day-container">
              <span class="streak-check check"></span>
              <span class="day-name">Thu</span>
            </div>
            <div class="day-container">
              <span class="streak-check current"></span>
              <span class="day-name">Fri</span>
            </div>
            <div class="day-container">
              <span class="streak-check"></span>
              <span class="day-name">Sat</span>
            </div>
            <div class="day-container">
              <span class="streak-check"></span>
              <span class="day-name">Sun</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <p class="monthly-streaks">Monthly Streaks soon...</p>
  </div>
  <div class="coming-soon">
    <span>
      COMING SOON...
    </span>
    <p>stay tuned!</p>
  </div>
</div>
</body>
</html>
