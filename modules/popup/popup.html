<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purrfect Pomodoro Timer</title>
  <link rel="stylesheet" href="../global.css">
  <link href="popup.css" rel="stylesheet" type="text/css" />
  <script type="module" defer src="popup.js"></script>
</head>
<body>
  <div class="container">
    <h1 class="title">Purrfect Pomodoro Timer</h1>
    <div class="poll-btn popup">
      <button id="votePoll">+   Vote for New Features +</button>
    </div>
    
    <div class="focus-tab tab active">
      <div class="heading-container">
        <h1 class="focus-title">Start Focusing</h1>
        <div class="tab-btns">
          <a href="https://chromewebstore.google.com/detail/purrfect-focus/aobapnhgpjlldncjopmbbfeoomombhel/reviews" class="tab-btn rate-tab-btn">
            <span class="tooltip">rate us</span>
            <img src="/assets/icons/rate.png" alt="rate icon">
          </a>
          <a href="https://chromewebstore.google.com/detail/purrfect-focus/aobapnhgpjlldncjopmbbfeoomombhel/support" class="tab-btn support-tab-btn">
            <span class="tooltip">help</span>
            <img src="/assets/icons/help.png" alt="help icon">
          </a>
          <!-- <button class="tab-btn streak-tab-btn">
            <span class="tooltip">streak</span>
            <img src="/assets/icons/fire.png" alt="streak icon">
          </button> -->
          <button class="tab-btn history-tab-btn">
            <span class="tooltip">history</span>
            <img src="/assets/icons/history.png" alt="history icon">
          </button>
          <button class="tab-btn settings-tab-btn">
            <span class="tooltip">settings</span>
            <img src="/assets/icons/settings.png" alt="settings icon">
          </button>
        </div>
      </div>
      <p class="until-long"><span id="until-long-count">_</span> pomodoros until long break</p>
      <div class="middle">
        <div class="tasks-select-container">
          <label for="tasks-select">Task: </label>
          <select id="tasks-select">
          </select>
        </div>
        <div class="task-edit">
          <img src="../../assets/icons/pencil.png" alt="pencil">
        </div>
      </div>
      <div class="time-container">
        <button class="timer-tag simple">
          <div class="timer" id="timer">00:00</div>
        </button>
        <div class="timer-edit">
          <img src="../../assets/icons/pencil.png" alt="pencil">
        </div>
      </div>
      <div>
        <button class="focus-btn"><span id="focus-btn-text">Start Focusing</span></button>
        <div class="focus-btns-int">
          <button class="focus-btn-stop"><img  src="/assets/icons/stop.png" alt="stop"></button>
          <button class="focus-btn-next"><img  src="/assets/icons/next.png" alt="next"></button>
        </div>
      </div>
    </div>   
</div>
<div id="customPrompt" class="modal">
  <div class="modal-content">
    <h2 id="promptTitle">Prompt</h2>
    <p id="promptMessage"></p>
    <input type="text" id="promptInput"/>
    <select id="promptSelect"></select>
    <div class="modal-buttons">
      <button id="promptOk">✅OK</button>
      <button id="promptCancel">❌Cancel</button>
    </div>
    <p id="promptwarning"></p>
  </div>
</div>
<div id="customAlert" class="modal">
  <div class="modal-content">
    <h2 id="alertTitle">Alert</h2>
    <p id="alertMessage"></p>
    <div class="modal-buttons">
      <button id="alertOk">✅OK</button>
    </div>
  </div>
</div>
</body>
</html>
