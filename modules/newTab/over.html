<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purrfect Focus</title>
  <link rel="stylesheet" href="../global.css">
  <link rel="stylesheet" href="over.css">
  <script type="module" defer src="over.js"></script>
</head>
<body>
  <div class="container">
    <div class="heading-container">
      <h1 class="focus-title">Start Focusing</h1>
      <div class="tab-btns">
        <a target="_blank" href="https://chromewebstore.google.com/detail/purrfect-focus/aobapnhgpjlldncjopmbbfeoomombhel/reviews" class="tab-btn rate-tab-btn">
          <span class="tooltip">rate us</span>
          <img src="/assets/icons/rate.png" alt="rate icon">
        </a>
        <a target="_blank" href="https://chromewebstore.google.com/detail/purrfect-focus/aobapnhgpjlldncjopmbbfeoomombhel/support" class="tab-btn support-tab-btn">
          <span class="tooltip">help</span>
          <img src="/assets/icons/help.png" alt="help icon">
        </a>
        <button class="tab-btn history-tab-btn">
          <span class="tooltip">history</span>
          <img src="/assets/icons/history.png" alt="history icon">
        </button>
        <button class="tab-btn settings-tab-btn">
          <span class="tooltip">settings</span>
          <img src="/assets/icons/settings.png" alt="settings icon">
        </button>
      </div>
    </div>
    <p class="until-long"><span id="until-long-count">_</span> pomodoros until long break</p>
    <div class="time-container bigTimer">
      <div class="timer-tag simple">
        <div class="timer" id="timer">00:00</div>
      </div>
    </div>
    <div class="bottom">
      <div class="btns-container">
        <button class="focus-btn"><span class="focus-btn-text">Start Focusing</span></button>
        <div class="focus-btns-int">
          <button class="focus-btn-stop"><img  src="../../assets/icons/stop.png" alt="stop"></button>
          <button class="focus-btn-next"><img  src="../../assets/icons/next.png" alt="next"></button>
        </div>
      </div>
      <div class="quote-container"><span class="quote"></span></div>
    </div>
  </div>
</body>
</html>
