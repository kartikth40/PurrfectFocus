<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History - Purrfect Focus</title>
  <link rel="stylesheet" href="../global.css">
  <link rel="stylesheet" href="history.css">
  <script src="history.js" type="module" defer></script>
  </head>
<body>
  <div class="container">
    <div class="metrics-container">
      <div class="data-btns">
        <button class="sample-history-btn active">Show Sample</button>
        <button class="sample-history-btn-remove">Remove Sample</button>
        <button class="delete-btn">Delete All Data</button>
      </div>
      <div class="simple-metrics-container">
        <div class="simple-metrics">
          <h2 class="count today-count">00h 00m</h2>
          <p class="simple-metrics-title">Today</p>
        </div>
        <div class="simple-metrics">
          <h2 class="count week-count">00h 00m</h2>
          <p class="simple-metrics-title">This Week</p>
        </div>
        <div class="simple-metrics">
          <h2 class="count month-count">00.0h</h2>
          <p class="simple-metrics-title">This Month</p>
        </div>
        <div class="simple-metrics">
          <h2 class="count year-count">00.0h</h2>
          <p class="simple-metrics-title">This Year</p>
        </div>
      </div>
      <div class="week-metrics-container sub-metrics-container">
        <h2 class="week-metrics-title metrics-title">This Week's Focus Distribution</h2>
        <div class="graph-container week-graph-container">
          <div class="is-sample">*sample data</div>
          <div class="no-data week-no-data">Nothing To Display!</div>
          <div class="y-axis week-y-axis"></div>
          <div class="bars-container">
            <span class="bar week-bar" data-x="MON" data-value="0"></span>
            <span class="bar week-bar" data-x="TUE" data-value="0"></span>
            <span class="bar week-bar" data-x="WED" data-value="0"></span>
            <span class="bar week-bar" data-x="THU" data-value="0"></span>
            <span class="bar week-bar" data-x="FRI" data-value="0"></span>
            <span class="bar week-bar" data-x="SAT" data-value="0"></span>
            <span class="bar week-bar" data-x="SUN" data-value="0"></span>
          </div>
        </div>
      </div>
      <div class="month-metrics-container sub-metrics-container">
        <h2 class="month-metrics-title metrics-title">This Month's Focus Distribution</h2>
        <div class="graph-container month-graph-container">
          <div class="is-sample">*sample data</div>
          <div class="no-data month-no-data">Nothing To Display!</div>
          <div class="y-axis month-y-axis"></div>
          <div class="bars-container month-bars-container">
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
