<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History - Purrfect Focus</title>
  <link rel="stylesheet" href="../global.css">
  <link rel="stylesheet" href="history.css">
  <script src="history.js" type="module" defer></script>
  </head>
<body>
  <div class="container">
    <div class="metrics-container">
      <div class="simple-metrics-container">
        <div class="simple-metrics">
          <h2 class="count today-count">00h 00m</h2>
          <p class="simple-metrics-title">Today</p>
        </div>
        <div class="simple-metrics">
          <h2 class="count week-count">00h 00m</h2>
          <p class="simple-metrics-title">This Week</p>
        </div>
        <div class="simple-metrics">
          <h2 class="count month-count">00.0h</h2>
          <p class="simple-metrics-title">This Month</p>
        </div>
        <div class="simple-metrics">
          <h2 class="count year-count">00.0h</h2>
          <p class="simple-metrics-title">This Year</p>
        </div>
      </div>
      <div class="week-metrics-container">
        <h2 class="week-metrics-title">Weekly Focus Distribution</h2>
        <div class="graph-container">
          <div class="y-axis"></div>
          <div class="bars-container">
            <span class="bar" data-x="MON" data-value="0"></span>
            <span class="bar" data-x="TUE" data-value="0"></span>
            <span class="bar" data-x="WED" data-value="0"></span>
            <span class="bar" data-x="THU" data-value="0"></span>
            <span class="bar" data-x="FRI" data-value="0"></span>
            <span class="bar" data-x="SAT" data-value="0"></span>
            <span class="bar" data-x="SUN" data-value="0"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
